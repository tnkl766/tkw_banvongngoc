<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Xác nhận đơn hàng | JADE – Natural Gemstone Jewelry</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../css/cart-checkout.css">
  
  <script src="../js/orders.js" defer></script>
</head>
<body class="ny-workflow" data-page="order-success">
  <a class="ny-skip" href="#main">Đến nội dung chính</a>
  <header class="ny-site-header" data-site-header></header>

  <main class="ny-wrap ny-main" id="main">
    <noscript><p class="ny-panel">Hãy bật JavaScript để xem xác nhận đơn hàng.</p></noscript>
    
    <section class="ny-panel ny-empty" data-order-missing hidden>
      <span class="ny-tile-icon" data-icon="box" aria-hidden="true"></span>
      <h1>Chưa tìm thấy đơn hàng</h1>
      <p>Bạn có thể xem các đơn đã đặt trong tài khoản.</p>
      <a class="ny-button" href="account.html" data-link="account">Xem lịch sử đơn hàng</a>
    </section>

    <div class="ny-success ny-stack" data-order-content hidden>
      <section class="ny-confirmed">
        <div class="ny-confirmed__inner">
          <div class="ny-confirmed__mark" data-icon="check" aria-hidden="true"></div>
          <h1>Đặt hàng thành công</h1>
          <p data-success-note>Đơn hàng đã được tiếp nhận và đang được xử lý.</p>
        </div>
      </section>

      <section class="ny-panel" aria-label="Thông tin đơn đã đặt">
        <dl class="ny-receipt">
          <div><dt>Mã đơn hàng</dt><dd class="ny-order-code" data-order-value="code"></dd></div>
          <div><dt>Thời gian đặt</dt><dd data-order-value="date"></dd></div>
          <div><dt>Tổng thanh toán</dt><dd class="ny-receipt__total" data-order-value="total"></dd></div>
        </dl>
        <div class="ny-actions ny-actions--receipt">
          <a class="ny-button" href="order-detail.html" data-detail-link>Xem chi tiết đơn <span data-icon="arrow" aria-hidden="true"></span></a>
          <a class="ny-button ny-button--secondary" href="../index.html" data-link="home">Tiếp tục mua sắm</a>
        </div>
      </section>

      <section class="ny-panel" aria-labelledby="tracking-title">
        <div class="ny-panel-heading">
          <span class="ny-tile-icon" data-icon="truck" aria-hidden="true"></span>
          <h2 id="tracking-title">Hành trình đơn hàng</h2>
        </div>
        <ol class="ny-timeline" data-timeline></ol>
      </section>
    </div>
  </main>

  <footer class="ny-site-footer" data-site-footer></footer>
</body>
</html>
