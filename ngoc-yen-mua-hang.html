<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ngọc Yến | Giỏ hàng, thanh toán và xác nhận</title>
    <style>
:root {
    --green:#0d3b2e;
    --gold:#d4af37;
    --cream:#fcfbf7;
    --line:#e7e3da}
* {
    box-sizing:border-box}
body {
    margin:0;
    background:var(--cream);
    color:#333;
    font-family:Arial,sans-serif}
button,input,textarea,select {
    font:inherit}
button {
    cursor:pointer}
header,footer {
    background:var(--green);
    color:white}
.wrap {
    max-width:1050px;
    margin:auto;
    padding:0 18px}
.head {
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
    min-height:76px}
.brand {
    color:var(--gold);
    font-weight:bold;
    font-size:24px;
    letter-spacing:2px;
    text-decoration:none}
.nav {
    display:flex;
    align-items:center;
    gap:16px;
    flex-wrap:wrap}
.nav button {
    background:none;
    border:0;
    color:white;
    padding:9px 2px}
.nav .cart-link {
    border:1px solid #ffffff77;
    color:var(--gold);
    border-radius:5px;
    padding:9px 12px}
main {
    min-height:65vh}
.hero {
    background:linear-gradient(120deg,#0d3b2e,#28705b);
    color:white;
    text-align:center;
    padding:55px 20px}
.hero h1 {
    margin:0 0 12px;
    font-size:34px}
.hero p {
    margin:0;
    color:#e6e9da}
.section {
    padding:35px 0}
.section h2 {
    color:var(--green);
    margin:0 0 22px}
.grid {
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px}
.card,.box {
    background:white;
    border:1px solid var(--line);
    border-radius:10px;
    box-shadow:0 4px 18px #153a2b0b}
.card {
    overflow:hidden}
.stone {
    height:180px;
    display:grid;
    place-items:center;
    background:radial-gradient(circle at 45% 40%,#d2f0d6,#6fa885 48%,#174a39);
    font-size:72px;
    color:#f5df9b}
.card .inside {
    padding:17px}
.card h3 {
    color:var(--green);
    margin:0 0 8px}
.card p {
    min-height:38px;
    color:#666;
    font-size:14px}
.price {
    color:#a47d18;
    font-weight:bold;
    margin:14px 0}
.btn {
    border:0;
    border-radius:5px;
    background:var(--green);
    color:white;
    padding:11px 18px;
    font-weight:bold}
.btn:hover {
    background:#21634d}
.btn.secondary {
    background:white;
    color:var(--green);
    border:1px solid var(--green)}
.btn:disabled {
    background:#aaa;
    cursor:not-allowed}
.layout {
    display:grid;
    grid-template-columns:minmax(0,1.6fr) minmax(270px,1fr);
    gap:22px;
    align-items:start}
.box {
    padding:22px}
.row {
    display:flex;
    justify-content:space-between;
    gap:14px;
    align-items:center;
    padding:14px 0;
    border-bottom:1px solid var(--line)}
.row:last-child {
    border:0}
.product {
    display:flex;
    align-items:center;
    gap:15px}
.mini {
    width:68px;
    height:68px;
    flex:none;
    border-radius:8px;
    display:grid;
    place-items:center;
    background:#d7e9da;
    color:#14513b;
    font-size:35px}
.muted {
    color:#777;
    font-size:14px}
.remove {
    background:none;
    border:0;
    color:#a23c3c;
    text-decoration:underline;
    padding:5px 0}
.qty {
    display:flex;
    align-items:center;
    border:1px solid #ccc;
    border-radius:5px}
.qty button {
    border:0;
    background:#f7f7f3;
    padding:8px 12px}
.qty span {
    min-width:32px;
    text-align:center}
.total {
    font-weight:bold;
    color:var(--green);
    font-size:20px}
.progress {
    height:10px;
    border-radius:10px;
    background:#e8ece7;
    overflow:hidden;
    margin:12px 0}
.progress>div {
    height:100%;
    background:var(--gold);
    transition:width .2s}
.field {
    margin:0 0 15px}
.field label {
    display:block;
    font-weight:bold;
    font-size:14px;
    margin-bottom:6px}
.field input,.field textarea,.field select {
    width:100%;
    padding:11px;
    border:1px solid #ccc;
    border-radius:5px;
    background:white}
.field input:focus,.field textarea:focus,.field select:focus {
    outline:2px solid #91bba2}
.radio {
    display:block;
    padding:10px;
    border:1px solid var(--line);
    border-radius:5px;
    margin:8px 0}
.radio input {
    margin-right:8px}
.actions {
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-top:18px}
.empty {
    text-align:center;
    padding:35px 15px}
.empty .icon {
    font-size:55px}
.notice {
    border-radius:5px;
    background:#eef7ee;
    color:#195538;
    padding:12px;
    margin:14px 0}
.error {
    color:#ac3030;
    font-size:13px;
    min-height:17px}
.success {
    text-align:center;
    max-width:720px;
    margin:40px auto}
.check {
    font-size:62px;
    color:#27835a}
.summary-line {
    display:flex;
    justify-content:space-between;
    gap:16px;
    padding:8px 0}
.hidden {
    display:none!important}
footer {
    text-align:center;
    padding:22px;
    margin-top:25px}
@media(max-width:720px) {
    .head {
    align-items:flex-start;
    flex-direction:column;
    padding:16px 0}
.grid,.layout {
    grid-template-columns:1fr}
.hero {
    padding:38px 15px}
.hero h1 {
    font-size:27px}
.row {
    flex-wrap:wrap}
.nav {
    gap:10px}
}
    </style>
</head>
<body>
    <header>
        <div class="wrap head">
            <a class="brand" href="Trang web.html">
                NGỌC YẾN
            </a>
            <nav class="nav">
                <a href="Trang web.html" style="color:white;text-decoration:none">
                    Trang chủ
                </a>
                <button class="cart-link" onclick="showPage('cart')">
                    Giỏ hàng (
                    <span id="cartCount">
                        0
                    </span>
                    )
                </button>
            </nav>
        </div>
    </header>
    <main>
        <section id="cartPage" class="wrap section">
            <h2>
                Giỏ hàng của bạn
            </h2>
            <div id="cartBody">
            </div>
        </section>
        <section id="checkoutPage" class="wrap section hidden">
            <h2>
                Thông tin thanh toán
            </h2>
            <div class="layout">
                <form class="box" id="checkoutForm" novalidate>
                    <h3>
                        Thông tin giao hàng
                    </h3>
                    <div class="field">
                        <label for="fullname">
                            Họ và tên *
                        </label>
                        <input id="fullname" autocomplete="name" required>
                        <div class="error" id="nameError">
                        </div>
                    </div>
                    <div class="field">
                        <label for="phone">
                            Số điện thoại *
                        </label>
                        <input id="phone" type="tel" inputmode="tel" autocomplete="tel" required>
                        <div class="error" id="phoneError">
                        </div>
                    </div>
                    <div class="field">
                        <label for="address">
                            Địa chỉ giao hàng *
                        </label>
                        <textarea id="address" rows="3" autocomplete="street-address" required>
                        </textarea>
                        <div class="error" id="addressError">
                        </div>
                    </div>
                    <div class="field">
                        <label for="shipping">
                            Phương thức vận chuyển
                        </label>
                        <select id="shipping" onchange="renderCheckout()">
                            <option value="standard">
                                Giao tiêu chuẩn (30.000đ)
                            </option>
                            <option value="express">
                                Giao nhanh (50.000đ)
                            </option>
                        </select>
                    </div>
                    <h3>
                        Phương thức thanh toán
                    </h3>
                    <label class="radio">
                        <input type="radio" name="payment" value="COD" checked>
                        Thanh toán khi nhận hàng (COD)
                    </label>
                    <label class="radio">
                        <input type="radio" name="payment" value="Chuyển khoản">
                        Chuyển khoản ngân hàng
                    </label>
                    <label class="radio">
                        <input type="radio" name="payment" value="Thẻ tín dụng">
                        Thẻ tín dụng (mô phỏng)
                    </label>
                    <p class="muted">
                        Bài thực hành chỉ ghi nhận lựa chọn, chưa kết nối cổng thanh toán.
                    </p>
                    <div class="field">
                        <label for="note">
                            Ghi chú đơn hàng (không bắt buộc)
                        </label>
                        <textarea id="note" rows="2">
                        </textarea>
                    </div>
                    <div class="actions">
                        <button type="button" class="btn secondary" onclick="showPage('cart')">
                            Quay lại giỏ hàng
                        </button>
                        <button class="btn" type="submit">
                            Đặt hàng
                        </button>
                    </div>
                </form>
                <div class="box">
                    <h3>
                        Đơn hàng của bạn
                    </h3>
                    <div id="checkoutItems">
                    </div>
                    <div class="field">
                        <label for="coupon">
                            Mã giảm giá
                        </label>
                        <div class="actions">
                            <input id="coupon" placeholder="Nhập NGOCYEN10" style="padding:10px;flex:1;min-width:130px;border:1px solid #ccc;border-radius:5px">
                            <button class="btn secondary" onclick="applyCoupon()">
                                Áp dụng
                            </button>
                        </div>
                        <div id="couponMessage" class="muted" style="margin-top:7px">
                        </div>
                    </div>
                    <div id="checkoutTotals">
                    </div>
                </div>
            </div>
        </section>
        <section id="successPage" class="wrap section hidden">
            <div class="box success" id="successBody">
            </div>
        </section>
    </main>
    <footer>
        © 2026 Ngọc Yến - Trang Sức Ngọc Cao Cấp
    </footer>
<script>
// Sửa danh sách này cho khớp ID và giá sản phẩm trên trang chủ.
const products=[{id:1,name:'Vòng Hạt Ngọc',price:850000,icon:'◉'},{id:2,name:'Vòng Bản Ngọc',price:1450000,icon:'◌'},{id:3,name:'Nhẫn Ngọc',price:980000,icon:'◇'}];
const FREE_SHIP=2000000;
let cart=readCart(),couponApplied=false;
function readCart(){try{let value=JSON.parse(localStorage.getItem('ngocYenCart'));
return Array.isArray(value)?value.filter(x=>products.some(p=>p.id===x.id)&&Number.isInteger(x.qty)&&x.qty>0&&x.qty<=99):[]}catch(e){return []}}
function saveCart(){localStorage.setItem('ngocYenCart',JSON.stringify(cart));
document.getElementById('cartCount').textContent=cart.reduce((sum,x)=>sum+x.qty,0)}
function money(n){return n.toLocaleString('vi-VN')+'đ'}
function subtotal(){return cart.reduce((sum,x)=>sum+products.find(p=>p.id===x.id).price*x.qty,0)}
function addToCart(id){let item=cart.find(x=>x.id===id);
if(item){item.qty=Math.min(99,item.qty+1)}else{cart.push({id:id,qty:1})}saveCart();
showPage('cart')}
function changeQty(id,amount){let item=cart.find(x=>x.id===id);
if(!item)return;
item.qty+=amount;
if(item.qty<1)cart=cart.filter(x=>x.id!==id);
else item.qty=Math.min(item.qty,99);
couponApplied=false;
saveCart();
renderCart()}
function removeItem(id){cart=cart.filter(x=>x.id!==id);
couponApplied=false;
saveCart();
renderCart()}
function showPage(page){if(page==='checkout'&&!cart.length)page='cart';
for(let name of ['cart','checkout','success'])document.getElementById(name+'Page').classList.toggle('hidden',name!==page);
if(page==='cart')renderCart();
if(page==='checkout')renderCheckout();
window.scrollTo(0,0)}
function renderCart(){let area=document.getElementById('cartBody');
if(!cart.length){area.innerHTML='<div class="box empty"><div class="icon">🛍️</div><h3>Giỏ hàng đang trống</h3><p class="muted">Hãy chọn món trang sức bạn yêu thích.</p><a class="btn" href="Trang web.html" style="display:inline-block;text-decoration:none">Xem sản phẩm</a></div>';
return}let sum=subtotal();
area.innerHTML=`<div class="layout"><div class="box">${cart.map(x=>{let p=products.find(p=>p.id===x.id);return `<div class="row"><div class="product"><div class="mini">${p.icon}</div><div><strong>${p.name}</strong><div class="muted">${money(p.price)} / sản phẩm</div><button class="remove" onclick="removeItem(${p.id})">Xóa</button></div></div><div class="qty"><button aria-label="Giảm số lượng ${p.name}" onclick="changeQty(${p.id},-1)">−</button><span>${x.qty}</span><button aria-label="Tăng số lượng ${p.name}" onclick="changeQty(${p.id},1)">+</button></div><strong>${money(p.price*x.qty)}</strong></div>`}).join('')}</div><div class="box"><h3>Tóm tắt giỏ hàng</h3><div class="summary-line"><span>Tạm tính</span><strong>${money(sum)}</strong></div><div class="summary-line"><span>Vận chuyển</span><span>Tính khi thanh toán</span></div><hr><div class="summary-line total"><span>Tạm tính</span><span>${money(sum)}</span></div><div class="progress"><div style="width:${Math.min(100,sum/FREE_SHIP*100)}%"></div></div><p class="muted">${sum>=FREE_SHIP?'Bạn đã đủ điều kiện miễn phí giao tiêu chuẩn.':'Mua thêm '+money(FREE_SHIP-sum)+' để được miễn phí giao tiêu chuẩn.'}</p><div class="actions"><button class="btn" onclick="showPage('checkout')">Tiến hành thanh toán</button><a class="btn secondary" href="Trang web.html" style="text-decoration:none">Tiếp tục mua sắm</a></div></div></div>`}
function shippingFee(){return document.getElementById('shipping').value==='standard'&&subtotal()>=FREE_SHIP?0:document.getElementById('shipping').value==='express'?50000:30000}
function discount(){return couponApplied?Math.round(subtotal()*0.1):0}
function applyCoupon(){let code=document.getElementById('coupon').value.trim().toUpperCase();
couponApplied=code==='NGOCYEN10';
document.getElementById('couponMessage').textContent=couponApplied?'Đã áp dụng giảm 10% giá sản phẩm.':code?'Mã giảm giá không hợp lệ.':'Vui lòng nhập mã giảm giá.';
renderCheckout()}
function renderCheckout(){if(!cart.length){showPage('cart');
return}document.getElementById('checkoutItems').innerHTML=cart.map(x=>{let p=products.find(p=>p.id===x.id);
return `<div class="summary-line"><span>${p.name} × ${x.qty}</span><strong>${money(p.price*x.qty)}</strong></div>`}).join('');
document.getElementById('checkoutTotals').innerHTML=`<hr><div class="summary-line"><span>Tạm tính</span><strong>${money(subtotal())}</strong></div><div class="summary-line"><span>Giảm giá</span><span>−${money(discount())}</span></div><div class="summary-line"><span>Phí vận chuyển</span><span>${shippingFee()===0?'Miễn phí':money(shippingFee())}</span></div><hr><div class="summary-line total"><span>Tổng thanh toán</span><span>${money(subtotal()-discount()+shippingFee())}</span></div>`}
function safe(text){return String(text).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
document.getElementById('checkoutForm').addEventListener('submit',function(event){event.preventDefault();if(!cart.length){showPage('cart');return}let name=document.getElementById('fullname').value.trim(),phone=document.getElementById('phone').value.trim(),address=document.getElementById('address').value.trim();document.getElementById('nameError').textContent=name?'':'Vui lòng nhập họ và tên.';document.getElementById('phoneError').textContent=/^(0|\+84)[0-9]{9}$/.test(phone)?'':'Nhập số điện thoại Việt Nam hợp lệ (10 số).';document.getElementById('addressError').textContent=address?'':'Vui lòng nhập địa chỉ giao hàng.';if(!name||!/^(0|\+84)[0-9]{9}$/.test(phone)||!address)return;let order={code:'NY'+Date.now().toString().slice(-10),date:new Date().toLocaleString('vi-VN'),name,phone,address,payment:document.querySelector('input[name="payment"]:checked').value,shipping:document.getElementById('shipping').value,items:cart.map(x=>({...x})),total:subtotal()-discount()+shippingFee()};localStorage.setItem('ngocYenLastOrder',JSON.stringify(order));cart=[];couponApplied=false;saveCart();this.reset();document.getElementById('coupon').value='';document.getElementById('couponMessage').textContent='';renderSuccess(order);showPage('success')});
function renderSuccess(o){document.getElementById('successBody').innerHTML=`<div class="check">✓</div><h2>Đặt hàng thành công!</h2><p>Cảm ơn <strong>${safe(o.name)}</strong> đã mua hàng tại Ngọc Yến.</p><div class="notice">Mã đơn hàng: <strong>${safe(o.code)}</strong></div><div style="text-align:left"><div class="summary-line"><span>Thời gian</span><strong>${safe(o.date)}</strong></div><div class="summary-line"><span>Người nhận</span><strong>${safe(o.name)} - ${safe(o.phone)}</strong></div><div class="summary-line"><span>Địa chỉ</span><strong>${safe(o.address)}</strong></div><div class="summary-line"><span>Vận chuyển</span><strong>${o.shipping==='express'?'Giao nhanh':'Giao tiêu chuẩn'}</strong></div><div class="summary-line"><span>Thanh toán</span><strong>${safe(o.payment)}</strong></div><hr>${o.items.map(x=>{let p=products.find(p=>p.id===x.id);return `<div class="summary-line"><span>${p.name} × ${x.qty}</span><strong>${money(p.price*x.qty)}</strong></div>`}).join('')}<hr><div class="summary-line total"><span>Tổng tiền</span><span>${money(o.total)}</span></div></div><p class="muted">Đơn hàng được lưu trên trình duyệt này để bạn xem lại.</p><a class="btn" href="Trang web.html" style="display:inline-block;text-decoration:none">Tiếp tục mua sắm</a>`}
saveCart();renderCart();
</script>
</body>
</html>
